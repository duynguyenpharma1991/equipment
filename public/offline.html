<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: Arial, Helvetica, sans-serif; color: #333; background: #f4f6f5; text-align: center; padding: 24px; }
      h1 { color: #007338; margin: 0 0 8px; }
      p { margin: 4px 0; color: #666; }
      button { margin-top: 20px; padding: 10px 24px; border: 0; border-radius: 3px; background: #007338; color: #fff; font-weight: 700; font-size: 15px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Bạn đang ngoại tuyến / You are offline</h1>
      <p>Vui lòng kiểm tra kết nối mạng và thử lại.</p>
      <p>Please check your connection and try again.</p>
      <button type="button" onclick="location.reload()">Thử lại / Retry</button>
    </main>
  </body>
</html>
